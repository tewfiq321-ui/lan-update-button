license="${mod_license}"
issueTrackerURL="${mod_url}/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_url}"
authors="${mod_authors}"
description='''
Adds an Update button to the title, multiplayer and pause menus.

- Update from GitHub: downloads the newest release of this mod for your Minecraft version.
- Copy mods from a LAN host: while a friend's world is open to LAN, copy their exact mods folder over your WiFi so everyone matches.

Restart Minecraft after updating to load the new files.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
